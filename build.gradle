plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// Client-only mod for the 26.2 packs (Origins, VexVol): no server side at all.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = neo_version
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    def props = [
        minecraft_version_range: minecraft_version_range, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
        mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

jar {
    manifest { attributes(['Implementation-Title': project.mod_name, 'Implementation-Version': project.version]) }
}
